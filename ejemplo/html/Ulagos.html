<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio Ulagos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        /* Estilos generales para que se vea limpio y ordenado */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa; /* Un gris muy clarito de fondo */
            color: #333;
        }

        /* El encabezado con el color decente que pediste */
        header {
            background-color: #0055a4; /* Azul clásico e institucional */
            color: white;
            text-align: center;
            padding: 1.5rem 0;
        }

        .titulo-principal {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Estilos para la barra de navegación que agregaste */
        nav {
            background-color: #343a40; /* Gris oscuro para contrastar */
            padding: 10px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        nav ul {
            list-style: none; /* Quita los puntos de la lista */
            margin: 0;
            padding: 0;
        }

        nav ul li {
            display: inline; /* Pone los enlaces uno al lado del otro */
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none; /* Quita el subrayado */
            font-weight: bold;
            font-size: 1.1rem;
        }

        nav ul li a:hover {
            color: #90c2f7; /* Cambia de color al pasar el mouse */
        }

        /* Contenedor principal para centrar el contenido */
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        /* Caja para tu imagen */
        .contenedor-imagen {
            text-align: center;
            margin: 2rem 0;
            background-color: #e9ecef;
            padding: 20px;
            border-radius: 8px;
            border: 2px dashed #adb5bd; 
        }

        /* AQUÍ ESTÁ EL TAMAÑO DE LA IMAGEN AJUSTADO */
        .contenedor-imagen img {
            max-width: 300px; /* Reduje el tamaño máximo para que se vea más pequeña */
            height: auto;
            border-radius: 4px;
        }

        /* Estilos para los subtítulos hacia abajo */
        h2 {
            color: #0055a4;
            border-bottom: 2px solid #0055a4;
            padding-bottom: 0.5rem;
            margin-top: 2rem;
        }

        h3 {
            color: #495057;
            margin-top: 1.5rem;
        }

        p {
            line-height: 1.6;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="titulo-principal">sitio ulagos</h1>
    </header>

    <nav>
        <ul>
            <li><a href="Ulagos.html">Ulagos</a></li>
            <li><a href="inicio.html">Inicio</a></li>
            <li><a href="acercade.html">Acerca de</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Bienvenido al Portal</h2>
            <p>Titulo prueba</p>
            
            <div class="contenedor-imagen">
                <img src="/img/ulagos.png" alt="Logo de Ulagos">
            </div>
        </section>

        <section>
            <h2>Información Académica</h2>
            <p> Almuerzo</p>

            <h3>Detalles de la Carrera</h3>
            <p>.</p>
        </section>
    </main>

</body>
</html>
