<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Talento</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="form-header">
        <h1>Registra tu Talento</h1>
        <p>¡Comparte tu talento especial con nosotros!</p>
    </div>
    
    <form id="talentoForm" action="" method="post" class="form-container">
        <div class="form-section">
            <h3>Información Personal</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Tu Nombre:</label>
                    <input type="text" id="nombre" name="nombre" >
                </div>
                <div class="form-group">
                    <label for="edad">Tu Edad:</label>
                    <input type="number" id="edad" name="edad" min="1" max="18" >
                </div>
                <div class="form-group">
                    <label for="genero">Género:</label>
                    <select id="genero" name="genero" >
                        <option value="">Selecciona</option>
                        <option value="femenino">Femenino</option>
                        <option value="masculino">Masculino</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
            </div>
            <div class="form-group genero-otro" id="generoOtroGroup" style="display:none;">
                <label for="generoOtro">Especifica tu género:</label>
                <input type="text" id="generoOtro" name="generoOtro" placeholder="Escribe tu género">
            </div>
        </div>

        <div class="form-section">
            <h3>Tu Talento</h3>
            <div class="form-group">
                <label for="talento">¿Cuál es tu Talento?</label>
                <select id="talento" name="talento" >
                    <option value="">Selecciona tu talento</option>
                    <option value="musica">Música</option>
                    <option value="tecnologia">Tecnología</option>
                    <option value="arte">Arte</option>
                    <option value="deporte">Deporte</option>
                    <option value="danza">Danza</option>
                    <option value="escritura">Escritura</option>
                </select>
            </div>
            <div class="form-group">
                <label for="descripcion">Cuéntanos sobre tu Talento:</label>
                <textarea id="descripcion" name="descripcion" rows="4" placeholder="¿Qué haces? ¿Por qué te encanta?" ></textarea>
            </div>
            <div class="form-group">
                <label for="historia">¿Cómo descubriste tu Talento?</label>
                <textarea id="historia" name="historia" rows="3" placeholder="Cuéntanos tu historia..."></textarea>
            </div>
        </div>

        <div class="form-section">
            <h3>Tu Pokémon Acompañante</h3>
            <p style="font-size: 0.9em; color: #666; text-align: center; margin-bottom: 20px;">Busca un Pokémon que represente tu talento (ej. Pikachu, Lucario, 25)</p>
            
            <div class="form-group">
                <div style="display: flex; flex-wrap: wrap; gap: 10px; width: 100%; align-items: stretch; justify-content: center;">
                    <input type="text" id="pokemon_search" placeholder="Nombre o ID del Pokémon" 
                           style="flex: 1 1 auto; width: 100%; min-width: 150px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; margin: 0;">
                    
                    <button type="button" id="btn_buscar_pokemon" 
                            style="flex: 0 0 auto; width: auto; padding: 10px 20px; border-radius: 8px; background-color: #9b59b6; color: white; border: none; white-space: nowrap; margin: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;">🔍 Buscar</button>
                            
                    <button type="button" id="btn_azar_pokemon" 
                            style="flex: 0 0 auto; width: auto; padding: 10px 20px; border-radius: 8px; background-color: #f39c12; color: white; border: none; white-space: nowrap; margin: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold;">🎲 Al Azar</button>
                </div>
            </div>

            <style>
                @keyframes animarBordeMagico {
                    0% { border-color: #f78da7; box-shadow: 0 0 15px rgba(247, 141, 167, 0.4); }
                    33% { border-color: #b2e6ff; box-shadow: 0 0 15px rgba(178, 230, 255, 0.4); }
                    66% { border-color: #d6bfff; box-shadow: 0 0 15px rgba(214, 191, 255, 0.4); }
                    100% { border-color: #c4ffb3; box-shadow: 0 0 15px rgba(196, 255, 179, 0.4); }
                }
                
                .tarjeta-pokemon-magica {
                    margin: 20px auto 10px auto;
                    padding: 25px 30px;
                    background: #ffffff;
                    border-radius: 20px;
                    width: fit-content;
                    min-width: 260px;
                    text-align: center;
                    border: 4px solid #d6bfff;
                    animation: animarBordeMagico 4s linear infinite alternate;
                }

                .circulo-fondo {
                    background: #f8f5fb;
                    border-radius: 50%;
                    width: 150px;
                    height: 150px;
                    margin: 0 auto;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                }
            </style>

            <div id="pokemon_result" style="display: none; width: 100%;">
                
                <div class="tarjeta-pokemon-magica">
                    <h3 style="color: #8e44ad; margin: 0 0 8px 0; font-size: 1.3em;">¡Este será tu acompañante!</h3>
                    <h4 id="pokemon_name" style="text-transform: capitalize; margin: 0 0 15px 0; color: #555; font-size: 1.2em;"></h4>
                    
                    <div class="circulo-fondo">
                        <img id="pokemon_sprite" src="" alt="Sprite del Pokémon" style="width: 130px; height: 130px; object-fit: contain; filter: drop-shadow(0px 6px 8px rgba(0,0,0,0.25));">
                    </div>
                    
                    <input type="hidden" id="pokemon_seleccionado" name="pokemon_seleccionado">
                </div>

            </div>
        </div>
        <div class="form-section">
            <h3>Información Académica</h3>
            <div class="form-group">
                <label for="escuela">Tu Escuela/Instituto:</label>
                <input type="text" id="escuela" name="escuela" placeholder="Nombre de tu escuela">
            </div>
        </div>

        <div class="form-section">
            <h3>Información del Apoderado</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="acudiente">Nombre del Apoderado/Padre:</label>
                    <input type="text" id="acudiente" name="acudiente" >
                </div>
                <div class="form-group">
                    <label for="email">Email del Apoderado:</label>
                    <input type="email" id="email" name="email" >
                </div>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono del Apoderado:</label>
                <input type="tel" id="telefono" name="telefono" >
            </div>
        </div>

        <div class="form-section">
            <h3>Multimedia (Opcional)</h3>
            <div class="form-group">
                <label for="foto">Tu Foto o Video:</label>
                <input type="file" id="foto" name="foto" accept="image/*,video/*">
            </div>
        </div>

        <div id="mensajeMensajes" style="display: none; padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center; font-weight: bold;"></div>

        <div class="form-actions" style="display: flex; gap: 15px; justify-content: flex-start; margin-top: 20px;">
            <button type="button" onclick="window.location.href='index.html'">Volver al Inicio</button>
            <button type="submit">¡Registrar mi Talento!</button>
        </div>

    </form>
    <script src="../js/formulario.js"></script>
</body>
</html>
